name: Update README automatically

on:
  schedule:
    - cron: "0 */6 * * *"  # Run every 6 hours instead of every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update Currently Learning
        run: |
          python3 << 'EOF'
          import re
          
          with open('README.md', 'r') as f:
              content = f.read()
          
          new_content = "- TypeScript\n- React Performance Optimization\n- Express.js\n- Next.js"
          
          pattern = r'(<!--START_SECTION:currently-learning-->)(.*?)(<!--END_SECTION:currently-learning-->)'
          replacement = r'\1\n' + new_content + r'\n\3'
          
          updated = re.sub(pattern, replacement, content, flags=re.DOTALL)
          
          with open('README.md', 'w') as f:
              f.write(updated)
          EOF

      - name: Update GitHub Activity
        uses: Readme-Workflows/recent-activity@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "✨ Updated README automatically"
            git push
          fi
