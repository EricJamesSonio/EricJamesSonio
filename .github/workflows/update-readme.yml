name: Update README automatically

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Update Currently Learning section using a shell script
      - name: Update Currently Learning
        run: |
          file="README.md"
          section="currently-learning"
          
          # Create temp file with new content
          awk -v section="$section" '
          /<!--START_SECTION:currently-learning-->/ {
            print
            print "- TypeScript"
            print "- React Performance Optimization"
            print "- Express.js"
            print "- Next.js"
            skip=1
            next
          }
          /<!--END_SECTION:currently-learning-->/ {
            skip=0
          }
          !skip
          ' "$file" > "${file}.tmp" && mv "${file}.tmp" "$file"

      # Update Recent Activity section
      - name: Update GitHub Activity
        uses: Readme-Workflows/recent-activity@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          limit: 5
          file: README.md
          section: activity

      # Commit changes if any
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Updated README automatically" && git push)
