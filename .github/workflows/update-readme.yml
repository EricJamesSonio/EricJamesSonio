name: Update README automatically

on:
  schedule:
    - cron: "0 */12 * * *" # runs every 12 hours
  workflow_dispatch:       # allows manual trigger

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Update Currently Learning section dynamically (example)
      - name: Update Currently Learning
        uses: stefanzweifel/readme-md-action@v1
        with:
          updates: |
            - file: README.md
              section: currently-learning
              content: |
                - TypeScript
                - React Performance Optimization
                - Express.js
                - Next.js

      # 3. Update Recent Activity section
      - name: Update GitHub Activity
        uses: Readme-Workflows/recent-activity@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          limit: 5
          file: README.md
          section: activity

      # 4. Commit changes
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated README automatically" || echo "No changes to commit"
          git push
