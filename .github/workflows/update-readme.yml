name: Update README automatically

on:
  schedule:
    - cron: "0 */12 * * *" # every 12 hours
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # Update Currently Learning section
      - name: Update Currently Learning
        uses: stefanzweifel/readme-md-action@v1
        with:
          updates: |
            - file: README.md
              section: currently-learning
              content: |
                - TypeScript
                - React Performance Optimization
                - Express.js
                - Next.js

      # Update Recent Activity section
      - name: Update GitHub Activity
        uses: Readme-Workflows/recent-activity@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          limit: 5
          file: README.md
          section: activity

      # Commit changes
      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Updated README automatically" || echo "No changes to commit"
          git push
